<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回答一覧 - {{ title }}</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      background: #f7f5f2;
      color: #2d2a26;
      padding: 24px 16px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.3rem; color: #c45c6a; }
    .toolbar { margin: 16px 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar a {
      display: inline-block;
      padding: 10px 18px;
      background: #c45c6a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .toolbar a.secondary { background: #6b6560; }
    .count { color: #6b6560; font-size: 0.95rem; }
    .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; border: 1px solid #e8e2db; }
    table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
    th { background: #faf8f6; position: sticky; top: 0; }
    .empty { padding: 40px; text-align: center; color: #999; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{ title }} — 回答一覧</h1>
    <div class="toolbar">
      <span class="count">回答数: <strong>{{ count }}</strong> 件</span>
      <a href="/download">CSVダウンロード</a>
      <a href="/" class="secondary">アンケートページへ</a>
    </div>

    <div class="table-wrap">
      {% if responses %}
      <table>
        <thead>
          <tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr>
        </thead>
        <tbody>
          {% for row in responses %}
          <tr>{% for h in headers %}<td>{{ row.get(h, '') }}</td>{% endfor %}</tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <div class="empty">まだ回答はありません。アンケートページのURLを共有して回答を集めてください。</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
