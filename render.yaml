services:
  - type: web
    name: love-marriage-survey
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: GOOGLE_SHEET_NAME
        value: 回答
      - key: SURVEY_SECRET
        generateValue: true
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
